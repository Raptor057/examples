services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-2022
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:?define SA_PASSWORD en .env}
    volumes:
      - sql-data:/var/opt/mssql
    restart: always

volumes:
  sql-data:
