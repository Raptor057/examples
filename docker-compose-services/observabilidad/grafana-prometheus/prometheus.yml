global:
  scrape_interval: 15s

# Cada job es un servicio que expone metricas en formato Prometheus.
# Reemplaza los targets por los tuyos (host:puerto, sin http://).
scrape_configs:
  - job_name: 'mi-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5000']
        labels:
          instance: 'Mi API local'

  # Servidor Windows con windows_exporter (puerto 9182)
  - job_name: 'servidor-windows'
    metrics_path: /metrics
    static_configs:
      - targets: ['mi-servidor:9182']
        labels:
          instance: 'Servidor Windows'

  # Linux / Raspberry Pi con node_exporter (puerto 9100)
  - job_name: 'raspberrypi'
    metrics_path: /metrics
    static_configs:
      - targets: ['192.0.2.10:9100']
        labels:
          instance: 'Raspberry Pi'
